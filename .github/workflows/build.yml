name: Build TropiFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Inspecter PCGUI dans le jar remappe
        if: always()
        run: |
          echo "" >> build-output.log
          echo "===== INTROSPECTION PCGUI =====" >> build-output.log
          jar=$(find ~/.gradle -iname "*.jar" \( -ipath "*cobblemon*" -o -iname "*MdwFAVRL*" \) 2>/dev/null | head -20 | while read f; do
                  if unzip -l "$f" 2>/dev/null | grep -q "client/gui/pc/PCGUI.class"; then echo "$f"; break; fi
                done)
          echo "JAR: $jar" >> build-output.log
          if [ -n "$jar" ]; then
            rm -rf /tmp/pcgui && mkdir -p /tmp/pcgui && cd /tmp/pcgui
            unzip -o -q "$jar" "com/cobblemon/mod/common/client/gui/pc/*" || true
            javap -p com/cobblemon/mod/common/client/gui/pc/PCGUI.class >> $GITHUB_WORKSPACE/build-output.log 2>&1 || true
            echo "----- classes du package pc -----" >> $GITHUB_WORKSPACE/build-output.log
            ls com/cobblemon/mod/common/client/gui/pc/ >> $GITHUB_WORKSPACE/build-output.log 2>&1 || true
          fi
        shell: bash

      - name: Pousser le log en cas d'echec
        if: failure()
        run: |
          git config user.name ci-log
          git config user.email ci@log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f build-output.log
          git commit -q -m "log de build $GITHUB_SHA"
          git push -f origin ci-log
        shell: bash

      - name: Publier les erreurs dans le resume
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|FAILED|What went wrong|Caused by|Could not" build-output.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo '---- tail ----' >> $GITHUB_STEP_SUMMARY
          tail -30 build-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tropifix-build
          path: build/libs/*.jar
